[project]
name = "nanovlm-encoder-free"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "einops>=0.8.0",
    "huggingface-hub>=1.22.0",
    "jaxtyping>=0.2.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "transformers>=5.13.0",
    "wandb>=0.28.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.10.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# UP: pyupgrade — modernize typing syntax (builtin generics, `X | None`, drop dead typing imports)
select = ["UP"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# "basic" flags real type errors without drowning you in strict-mode noise.
typeCheckingMode = "basic"
exclude = [".venv", "wandb", "checkpoints", "logs", "assets", "**/__pycache__", "**/.ipynb_checkpoints"]
